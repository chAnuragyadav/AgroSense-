[build]
  command = "npm install --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# API requests go to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router: serve index.html for /soil, /irrigation, /weather on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
